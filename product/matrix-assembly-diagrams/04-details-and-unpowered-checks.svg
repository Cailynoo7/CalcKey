<text x="468" y="670" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="20" fill="#203346" text-anchor="start">轴扣入面板、坐平，再套PCB。</text>
<rect x="846" y="582" width="370" height="130" rx="10" fill="#edf4f7" stroke="none" stroke-width="2"/>
<circle cx="875" cy="615" r="17" fill="#246eae" stroke="#246eae" stroke-width="2"/>
<text x="875" y="622" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="23" fill="#ffffff" text-anchor="middle">3</text>
<text x="904" y="622" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="24" fill="#203346" text-anchor="start">40个触点</text>
<text x="863" y="670" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="20" fill="#203346" text-anchor="start">底面焊轴脚；中心塑料柱不焊。</text>
<rect x="1241" y="582" width="370" height="130" rx="10" fill="#edf4f7" stroke="none" stroke-width="2"/>
