<text x="114" y="622" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="24" fill="#203346" text-anchor="start">R与D</text>
<text x="73" y="670" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="20" fill="#203346" text-anchor="start">先焊4只0805及20只二极管。</text>
