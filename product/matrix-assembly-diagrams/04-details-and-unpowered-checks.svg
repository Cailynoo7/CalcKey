<text x="866" y="463" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="22" fill="#203346" text-anchor="start">每只一端接3V3、一端接对应列；焊好后查四处锡桥。</text>
<text x="56" y="554" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="27" fill="#203346" text-anchor="start">焊装顺序</text>
