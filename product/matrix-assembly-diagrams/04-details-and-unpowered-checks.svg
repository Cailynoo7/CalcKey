<text x="1270" y="622" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="23" fill="#ffffff" text-anchor="middle">4</text>
<text x="1299" y="622" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="24" fill="#203346" text-anchor="start">15根线</text>
<text x="1258" y="670" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="20" fill="#203346" text-anchor="start">10根矩阵线＋5根LCD线。</text>
<text x="56" y="762" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="25" fill="#203346" text-anchor="start">断电检查：先不连Pico和LCD，测矩阵；接线后再逐根对表查通断。</text>
<rect x="56" y="781" width="1568" height="45" rx="0" fill="#edf4f7" stroke="none" stroke-width="2"/>
<rect x="73" y="793" width="18" height="18" rx="0" fill="#ffffff" stroke="#ccd9e1" stroke-width="2"/>
<text x="106" y="809" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">4列上拉</text>
<text x="293" y="809" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">J6/J7/J8/J9各对J10约10kΩ；列间约20kΩ可来自两个上拉。</text>
<text x="1596" y="809" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="18" fill="#647787" text-anchor="end">待测</text>
<rect x="56" y="830" width="1568" height="45" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<rect x="73" y="842" width="18" height="18" rx="0" fill="#ffffff" stroke="#ccd9e1" stroke-width="2"/>
<text x="106" y="858" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">20键二极管</text>
<text x="293" y="858" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">逐键按下：红表笔接列J6～J9，黑表笔接行J1～J5，测正向压降。</text>
<text x="1596" y="858" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="18" fill="#647787" text-anchor="end">待测</text>
<rect x="56" y="879" width="1568" height="45" rx="0" fill="#edf4f7" stroke="none" stroke-width="2"/>
<rect x="73" y="891" width="18" height="18" rx="0" fill="#ffffff" stroke="#ccd9e1" stroke-width="2"/>
<text x="106" y="907" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">交换表笔</text>
<text x="293" y="907" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">按键保持按下再反测，应截止；在路有疑问时分离器件复测。</text>
<text x="1596" y="907" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="18" fill="#647787" text-anchor="end">待测</text>
<rect x="56" y="928" width="1568" height="45" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<rect x="73" y="940" width="18" height="18" rx="0" fill="#ffffff" stroke="#ccd9e1" stroke-width="2"/>
<text x="106" y="956" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">15根导线</text>
<text x="293" y="956" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">逐根端到端通断；相邻裸焊点无桥接；J10/P5仅接3V3。</text>
<text x="1596" y="956" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="18" fill="#647787" text-anchor="end">待测</text>
<rect x="56" y="977" width="1568" height="45" rx="0" fill="#edf4f7" stroke="none" stroke-width="2"/>
<rect x="73" y="989" width="18" height="18" rx="0" fill="#ffffff" stroke="#ccd9e1" stroke-width="2"/>
<text x="106" y="1005" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">绝缘与应力</text>
<text x="293" y="1005" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#203346" text-anchor="start">P6～P9各自绝缘；线皮胶带固定，过孔处不留裸铜，不用焊盘承力。</text>
<text x="1596" y="1005" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="18" fill="#647787" text-anchor="end">待测</text>
<text x="56" y="1100" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="21" fill="#647787" text-anchor="start">每根软线约150mm留维护余量，沿底盖平铺；避开USB、合盖柱和翻脚机构。只做断电检查，不烧录。</text>
